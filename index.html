<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penggunaan Kenderaan - Senggara Bangunan</title>
    <link rel="stylesheet" href="style.css?v=emailonly">
</head>
<body class="login-page">
    <div class="container">
        <div class="header">
            <div class="logos-wrapper">
                <div class="logo-container">
                    <div class="logo-badge">
                        <img src="logo-jkr-sabah.png" alt="Logo JKR Sabah" class="main-logo">
                    </div>
                </div>
                <div class="logo-divider"></div>
                <div class="logo-container csb-logo">
                    <div class="logo-badge">
                        <img src="CSB LOGO-512.png" alt="Logo CSB" class="main-logo">
                    </div>
                </div>
            </div>
            <h1>Sistem Penggunaan Kenderaan</h1>
            <p class="subtitle">Cawangan Senggara Bangunan</p>
            <p class="org-name">Jabatan Kerja Raya Sabah</p>
        </div>
        
        <div class="login-cards">
            <div class="login-card user-card" onclick="window.location.href='user.html'">
                <div class="card-icon">👤</div>
                <h2>Pengguna</h2>
                <p>Pohon Kenderaan</p>
                <div class="card-arrow">→</div>
            </div>
            
            <div class="login-card admin-card" onclick="window.location.href='admin.html'">
                <div class="card-icon">🔐</div>
                <h2>Admin</h2>
                <p>Urus Kelulusan</p>
                <div class="card-arrow">→</div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2024 Sistem Penggunaan Kenderaan | Cawangan Senggara Bangunan</p>
            <p class="footer-org">Jabatan Kerja Raya Sabah</p>
        </div>
    </div>
</body>
</html>
